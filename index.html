<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>バス、次いつ？</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f3f1ec;
    --card: #ffffff;
    --ink: #1b1f1d;
    --sub: #4d5652;
    --line: #d9d5cc;
    --accent: #0f5c4d;
    --accent-ink: #ffffff;
    --soon: #c2410c;
    --past: #9aa19d;
    --chip-i: #dbeafe;
    --chip-i-ink: #1e3a8a;
    --chip-t: #fde2e2;
    --chip-t-ink: #8a1c1c;
    --chip-warn: #fef3c7;
    --chip-warn-ink: #7c4a03;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614;
      --card: #1c2220;
      --ink: #f1f4f2;
      --sub: #b5bfba;
      --line: #2f3835;
      --accent: #3fb59a;
      --accent-ink: #08201a;
      --soon: #fb923c;
      --past: #5f6864;
      --chip-i: #1e3a5f;
      --chip-i-ink: #cfe3ff;
      --chip-t: #5a2222;
      --chip-t-ink: #ffd9d9;
      --chip-warn: #4a3a10;
      --chip-warn-ink: #fde68a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.4;
    padding: max(12px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 4px 0 12px; }
  header h1 { font-size: 22px; margin: 0; font-weight: 800; }
  #today { font-size: 17px; color: var(--sub); font-weight: 600; white-space: nowrap; }

  #routes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  #routes button {
    font: inherit; font-size: 16px; font-weight: 700; white-space: nowrap;
    padding: 12px 4px; min-height: 52px;
    border: 2px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink);
    transition: transform .08s ease, background .15s ease;
  }
  #routes button:active { transform: scale(.96); }
  #routes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .next {
    background: var(--card); border-radius: 18px; padding: 18px 18px 16px;
    border: 2px solid var(--accent); margin-bottom: 12px;
  }
  .next .label { font-size: 17px; font-weight: 700; color: var(--accent); }
  .next .time { font-size: 64px; font-weight: 800; letter-spacing: .02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .next .wait { font-size: 28px; font-weight: 800; }
  .wait.soon { color: var(--soon); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; font-size: 17px; color: var(--sub); }
  .chip { display: inline-block; font-size: 15px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .chip.I { background: var(--chip-i); color: var(--chip-i-ink); }
  .chip.T { background: var(--chip-t); color: var(--chip-t-ink); }
  .chip.warn { background: var(--chip-warn); color: var(--chip-warn-ink); }
  .chip.tomorrow { background: var(--ink); color: var(--bg); }

  .later { display: grid; gap: 8px; }
  .later .row {
    background: var(--card); border-radius: 14px; padding: 12px 16px;
    display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center;
  }
  .later .time { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .later .wait { font-size: 20px; font-weight: 700; }
  .later .meta { grid-column: 1 / -1; margin-top: 4px; }

  .done { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 12px; font-size: 22px; font-weight: 800; }

  details { margin-top: 20px; background: var(--card); border-radius: 14px; padding: 4px 16px; }
  summary { font-weight: 700; padding: 12px 0; cursor: pointer; }
  .all { display: grid; grid-template-columns: 3em 1fr; gap: 6px 10px; padding-bottom: 14px; font-variant-numeric: tabular-nums; }
  .all .h { font-weight: 800; color: var(--sub); }
  .all .m { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .all .m span.past { color: var(--past); }
  .all .m span.nx { color: var(--accent); font-weight: 800; text-decoration: underline; }

  footer { margin-top: 20px; font-size: 15px; color: var(--sub); }
</style>
</head>
<body>
<header>
  <h1>バス、次いつ？</h1>
  <div id="today"></div>
</header>
<nav id="routes"></nav>
<main id="main"></main>
<details id="alltable">
  <summary>今日の時刻表をぜんぶ見る</summary>
  <div class="all" id="all"></div>
</details>
<footer id="foot"></footer>

<script src="timetable.js"></script>
<script src="holidays.js"></script>
<script src="app.js"></script>
</body>
</html>
